<style>
/* 配布PDFそのものを映し、答えはPDFのレイヤーを重ねて出す。アプリ部分は暗い机の色で単一テーマ。 */
:root{
  --desk:#1d2429; --bar:#141a1e; --bar-line:#343f47; --bar-fg:#e8edf0; --bar-dim:#9aa7b0; --bar-on:#3a4c59; --go:#2d5d8a; --go-line:#5b8db8;

html,body{height:100%;margin:0;overflow:hidden;background:var(--desk);color:var(--bar-fg);font-family:var(--ui)}
body{position:fixed;inset:0;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* いちばん新しく出た答え：出た瞬間にピカッと光り、次へ進むまで薄い黄色を残す */
.hl{position:absolute;border-radius:5px;pointer-events:none;background:rgba(255,224,0,.3);mix-blend-mode:multiply;opacity:0;transition:opacity .25s ease}
.hl.on{opacity:1}
.hl.flash{animation:hlflash 1.5s ease-out .35s backwards}   /* 窓が動き終わるころに光る */
@keyframes hlflash{0%{background:rgba(255,200,0,.75);box-shadow:0 0 0 7px rgba(255,190,0,.85)}60%{box-shadow:0 0 0 3px rgba(255,190,0,.45)}100%{background:rgba(255,224,0,.3);box-shadow:0 0 0 0 rgba(255,190,0,0)}}
#ink{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}

#bar{flex:none;display:flex;align-items:center;gap:6px;background:var(--bar);border-top:1px solid var(--bar-line);padding-top:7px;padding-bottom:max(7px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;font-size:14px;touch-action:pan-x}
#bar button{font:inherit;color:var(--bar-fg);background:transparent;border:1px solid var(--bar-line);border-radius:7px;height:44px;min-width:44px;padding:0 9px;white-space:nowrap;cursor:pointer;flex:none;touch-action:manipulation}

#bar button:focus-visible{outline:2px solid #9cc4e4;outline-offset:1px}
#bar button:disabled{opacity:.35}
#bar .sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}

@media (prefers-reduced-motion:reduce){#sheet,.ly{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'),sheet=$('#sheet'),inkSvg=$('#ink'),live=$('#live'),msg=$('#msg');
const PT=0.75;                          /* PDFは 1px = 0.75pt で作っている */
const GAP=36;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LID='01-yayoi';
const KEY=k=>LID+':'+k;
let L=null,stuDoc=null,layDoc=null,pageW=794,pageH=1122.5,pages=[],layers={};
let idx=0,view='class',cam={x:0,y:0,s:1},camTarget='p1';
const dprOf=()=>Math.min(window.devicePixelRatio||1,3);

/* ---------- PDFの描画 ---------- */
const jobs=new WeakMap();
async function draw(pdfPage,canvas,x,y,w,h,R,transparent){
  const old=jobs.get(canvas);if(old){try{old.cancel()}catch(e){}}
  const cw=Math.max(1,Math.round(w*R)),ch=Math.max(1,Math.round(h*R));
  const off=document.createElement('canvas');off.width=cw;off.height=ch;
  const ctx=off.getContext('2d');
  const task=pdfPage.render({canvasContext:ctx,viewport:pdfPage.getViewport({scale:R/PT,offsetX:-x*R,offsetY:-y*R}),background:transparent?'rgba(0,0,0,0)':'#ffffff'});
  jobs.set(canvas,task);
  try{await task.promise}catch(e){return false}
  if(jobs.get(canvas)!==task)return false;
  canvas.width=cw;canvas.height=ch;canvas.getContext('2d').drawImage(off,0,0);
  return true;
}
function maxR(w,h){return Math.min(6,Math.sqrt(9e6/(w*h)))}   /* 1枚の描画を900万画素までに抑える */

async function buildPages(){
  for(let i=0;i<L.pages;i++){
    const pp=await stuDoc.getPage(i+1);
    const div=document.createElement('div');div.className='pg';div.style.top=(i*(pageH+GAP))+'px';div.style.width=pageW+'px';div.style.height=pageH+'px';
    const base=document.createElement('canvas');base.className='base';
    const det=document.createElement('canvas');det.className='detail';det.hidden=true;
    div.append(base,det);sheet.insertBefore(div,inkSvg);
    pages.push({div,base,det,pp,detR:0});
  }
  for(const l of L.layers){
    const d=document.createElement('div');d.className='ly';
    Object.assign(d.style,{left:l.x+'px',top:l.y+'px',width:l.w+'px',height:l.h+'px'});
    const c=document.createElement('canvas');d.appendChild(c);pages[l.page].div.appendChild(d);
    /* 光らせる所：部品ごとの位置（parts）。古い教材は答えの範囲の内側 */
    const hl=(l.parts||[[l.x+6,l.y+6,l.w-12,l.h-12]]).map(([x,y,w,h])=>{
      const e=document.createElement('div');e.className='hl';Object.assign(e.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
      pages[l.page].div.insertBefore(e,pages[l.page].det.nextSibling);return e;
    });
    layers[l.id]={...l,div:d,canvas:c,hl,R:0,pp:await layDoc.getPage(l.layerPage+1)};
  }
  const H=L.pages*(pageH+GAP)-GAP;
  sheet.style.width=pageW+'px';sheet.style.height=H+'px';
  inkSvg.setAttribute('viewBox',`0 0 ${pageW} ${H}`);inkSvg.style.width=pageW+'px';inkSvg.style.height=H+'px';
  const R0=Math.min(2.6,dprOf()*1.3);
  await Promise.all(pages.map(p=>draw(p.pp,p.base,0,0,pageW,pageH,R0,false)));
}
function wantR(){return Math.max(1,cam.s*dprOf())}

/* ---------- プロジェクター合わせ（iPad→Zoom→PC→プロジェクター） ----------
   Zoom は iPad の画面を PC（16:9）の横いっぱいに広げるので、映るのは iPad の画面の上から「横幅×9/16」だけ。
   オンのときは、その範囲（projRegion）の中に窓を収め、映らない所は暗くする。位置と高さは少しずつ直せる。設定はこのiPadに覚える */
let proj=Object.assign({on:true,dy:0,dh:0},store.get('proj')||{});
function projRegion(){
  const r=stage.getBoundingClientRect();
  if(!proj.on)return{top:0,h:r.height,on:false};
  const top=Math.max(0,proj.dy-r.top),h=Math.max(120,Math.min(r.height-top,Math.round(innerWidth*9/16)+proj.dh));

  const t=rectOf(id),r=stage.getBoundingClientRect(),pad=10,reg=projRegion();

  else if(t.v){x0=t.x;w=t.w;y0=t.y;h=t.h}   /* 縦書きの教材：決めた範囲をそのまま映す */
  else{x0=30;w=pageW-60;y0=t.y-14;h=t.h+28}
  const s=Math.min((r.width-pad*2)/w,(reg.h-pad*2)/h,t.isPage?9:2.4);
  setCam({s,x:(r.width-w*s)/2-x0*s,y:reg.top+(reg.h-h*s)/2-y0*s},animated);camTarget=id;

}

function smooth(pts){                     /* 角を少し丸めて、がたつきを減らす（端点はそのまま） */
  if(pts.length<3)return pts;
  const o=[pts[0]];
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25,a[2]*.75+b[2]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75,a[2]*.25+b[2]*.75])}

}
function outline(raw,exact){
  const pts=exact?raw:smooth(raw),c=(x,y,r)=>`M${f1(x-r)} ${f1(y)}a${f1(r)} ${f1(r)} 0 1 0 ${f1(2*r)} 0a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2*r)} 0`;
  if(pts.length<2){const p=pts[0];return c(p[0],p[1],p[2]/2)}
  const Lp=[],Rp=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,pts.length-1)],p=pts[i];
    let dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;const r=p[2]/2;
    Lp.push(`${f1(p[0]-dy*r)} ${f1(p[1]+dx*r)}`);Rp.unshift(`${f1(p[0]+dy*r)} ${f1(p[1]-dx*r)}`);
  }
  const s=pts[0],e=pts[pts.length-1];

}

      const mv=ev=>fn(ev),up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});

let lastErase=null;
function eraserR(){return sizeOf('eraser')/cam.s}
function eraseAt(pt){
  const R=eraserR(),from=lastErase||pt;lastErase=pt;
  const n=Math.max(1,Math.ceil(Math.hypot(pt[0]-from[0],pt[1]-from[1])/(R/2)));
  const probes=[];for(let i=1;i<=n;i++)probes.push([from[0]+(pt[0]-from[0])*i/n,from[1]+(pt[1]-from[1])*i/n]);
  const near=q=>probes.some(p=>Math.hypot(q[0]-p[0],q[1]-p[1])<R+q[2]/2);
  let changed=false;const out=[];
  for(const s of strokes){
    if(!s.p.some(near)){out.push(s);continue}
    changed=true;
    if(cfg.eraser.mode==='stroke')continue;
    let run=[];
    const flush=()=>{if(run.length>=2||(run.length===1&&s.p.length===1))out.push({...s,p:run});run=[]};
    for(const q of s.p){if(near(q))flush();else run.push(q)}
    flush();
  }
  if(changed){strokes=out;renderInk()}

const HOLD_MS=550;let holdTimer=null,holdAt=null;
function rdp(pts,eps){
  if(pts.length<3)return pts.slice();

  for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],a,b);if(d>dm){dm=d;k=i}}
  if(dm<=eps)return[a,b];
  const l=rdp(pts.slice(0,k+1),eps),r=rdp(pts.slice(k),eps);return l.slice(0,-1).concat(r);

function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;let t=L2?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}

  pts.forEach((p,i)=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);if(i)len+=Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1])});

  const dev=Math.max(...pts.map(p=>segDist(p,a,b)));
  if(dev<Math.max(5/cam.s,ab*.07))return{kind:'line',v:[a,b]};
  /* 閉じた図形 */
  if(ab<Math.max(diag*.25,18/cam.s)){
    const ring=pts.concat([a]);
    let v=rdp(ring,diag*.09);
    if(v.length>2&&Math.hypot(v[0][0]-v[v.length-1][0],v[0][1]-v[v.length-1][1])<diag*.2)v=v.slice(0,-1);
    /* 始点が辺の途中にあると角が1つ多く数えられるので、ほぼ一直線の角は取り除く */

    if(v.length===4){

function shapePoints(sh,w){
  const out=[],step=2/cam.s;
  if(sh.kind==='ellipse'){
    const n=Math.max(48,Math.ceil(2*Math.PI*Math.max(sh.rx,sh.ry)/step));
    for(let i=0;i<=n;i++){const t=i/n*2*Math.PI;out.push([sh.cx+sh.rx*Math.cos(t),sh.cy+sh.ry*Math.sin(t),w])}
    return out;
  }
  const v=sh.v;
  for(let i=0;i<v.length-1;i++){
    const a=v[i],b=v[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step));
    for(let k=0;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n,w]);
  }
  out.push([v[v.length-1][0],v[v.length-1][1],w]);

    const o=pointerOffset(x);
    g.shadowBlur=0;g.translate(x+o[0],y+o[1]);if(o[2])g.scale(-1,1);
    if(L.shape==='haniwa')drawHaniwa(g,t,moving,false);else drawFairy(g,t,moving,false);
    g.restore();return;
  }
  if(L.shape==='arrow'){            /* 左上を指す矢印。ペン先は矢印の右下 */
    const s=1.7,P=[[0,0],[0,26],[7,20],[12,31],[17,29],[12,18],[21,18]],o=pointerOffset(x);
    g.translate(x+o[0],y+o[1]);if(o[2])g.scale(-1,1);g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0]*s,p[1]*s):g.moveTo(p[0]*s,p[1]*s));g.closePath();
    g.shadowBlur=14;g.fillStyle=L.c;g.fill();g.shadowBlur=0;g.lineWidth=2.5;g.strokeStyle='#fff';g.stroke();
  }else if(L.shape==='ring'){       /* ペン先を囲む輪 */
    g.shadowBlur=16;g.lineWidth=5;g.strokeStyle=L.c;g.beginPath();g.arc(x,y,28,0,7);g.stroke();
    g.shadowBlur=0;g.fillStyle=`rgba(${rgb},.12)`;g.fill();
  }else if(L.shape==='hand'){       /* 上を指す指さし。ペン先は手の右下 */
    const o=pointerOffset(x);
    g.font='46px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='top';
    g.translate(x+o[0],y+o[1]);if(o[2])g.scale(-1,1);
    g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=8;g.fillText('👆',4,-3);
  }else{                            /* 光る点 */
    g.shadowBlur=22;g.fillStyle=L.c;g.beginPath();g.arc(x,y,10,0,7);g.fill();
    g.shadowBlur=0;g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(x,y,3.5,0,7);g.fill();
  }
  g.restore();
}
function laserFrame(){
  const now=performance.now();lctx.clearRect(0,0,live.width/ldpr,live.height/ldpr);
  if(!laser){laserRAF=0;return}
  const last=laser.pts[laser.pts.length-1];
  laser.pts=laser.pts.filter(p=>now-p[2]<LASER_MS);
  if(laser.active&&last&&!laser.pts.length)laser.pts.push(last);   /* ペンを止めていても光る点は残す */
  const P=laser.pts,L=cfg.laser,n=parseInt(L.c.slice(1),16),rgb=`${n>>16&255},${n>>8&255},${n&255}`;
  lctx.save();lctx.lineCap='round';lctx.lineJoin='round';
  /* 跡はペン先ではなく「指している先」に出す */
  const off=P.length?pointerOffset(P[P.length-1][0]):[0,0];
  if(L.trail)for(let i=1;i<P.length;i++){const a=1-(now-P[i][2])/LASER_MS;
    lctx.strokeStyle=`rgba(${rgb},${(a*.85).toFixed(3)})`;lctx.lineWidth=2+a*5;lctx.shadowColor=`rgba(${rgb},.9)`;lctx.shadowBlur=10*a;
    lctx.beginPath();lctx.moveTo(P[i-1][0]+off[0],P[i-1][1]+off[1]);lctx.lineTo(P[i][0]+off[0],P[i][1]+off[1]);lctx.stroke()}
  laser.sp=(laser.sp||[]).filter(s=>now-s.b<900);drawSparkles(lctx,laser.sp,now);
  if(laser.active&&P.length)drawPointerHead(P[P.length-1][0],P[P.length-1][1],L,rgb);
  lctx.restore();
  if(!laser.active&&!P.length&&!laser.sp.length){laser=null;laserRAF=0;lctx.clearRect(0,0,live.width/ldpr,live.height/ldpr);return}
  laserRAF=requestAnimationFrame(laserFrame);
}
function addPoints(e){
  if(drawing.s)return;           /* 図形に整えた後は形を変えない */
  armHold(e);
  const list=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(const ev of list){
    const q=toSheet(ev),pts=drawing.p,l=pts[pts.length-1];
    if(Math.hypot(q[0]-l[0],q[1]-l[1])*cam.s<1.2)continue;
    q.push(widthFor(ev,l[2]));pts.push(q);
    if(drawing.t!=='marker')liveSeg(pts);
  }
  if(drawing.t==='marker'){
    lctx.clearRect(0,0,live.width/ldpr,live.height/ldpr);lctx.globalAlpha=.5;lctx.strokeStyle=drawing.c;lctx.lineWidth=drawing.p[0][2]*cam.s;lctx.beginPath();
    drawing.p.forEach((q,i)=>{const s=toScreen(q);i?lctx.lineTo(s[0],s[1]):lctx.moveTo(s[0],s[1])});lctx.stroke();lctx.globalAlpha=1;
  }
}
stage.addEventListener('pointerdown',e=>{
  if(view==='check'||!L)return;
  e.preventDefault();keepAwake();
  if(!opts.hidden){closeOpts();if(e.pointerType==='touch')return}   /* 設定パネルは画面に触れると閉じる */
  if(view==='class'&&isDrawInput(e)){
    if(e.pointerType==='pen'){lastPen=Date.now();touches.clear();gesture=null;penDown=true}
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
    /* 「移動」：ペン（とマウス）でなぞるとプリントが動く。書き込みはしない */
    if(tool==='move'){panning={id:e.pointerId,sx:e.clientX,sy:e.clientY,cam:{...cam}};return}
    if(tool==='laser'){laser={id:e.pointerId,pts:[],active:true};laserPush(e);if(!laserRAF)laserRAF=requestAnimationFrame(laserFrame);return}
    if(tool==='eraser'){pushHist();erasing=true;lastErase=null;eraseAt(toSheet(e));return}
    const col=cfg[tool].c;
    const q=toSheet(e);q.push(widthFor(e));drawing={id:e.pointerId,t:tool,c:col,p:[q]};
    if(tool!=='marker'){const a=toScreen(q);lctx.fillStyle=col;lctx.beginPath();lctx.arc(a[0],a[1],q[2]*cam.s/2,0,7);lctx.fill()}
    return;
  }
  if(e.pointerType==='touch'){
    if(penDown||e.width>120)return;            /* ペンで書いている間の手のひらは無視 */
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const t0=[...touches.values()];
    if(t0.length===1)gesture={sx:e.clientX,sy:e.clientY,t:Date.now(),moved:false,cam:{...cam},mode:1};
    else if(t0.length>=2){const a=t0[0],b=t0[1];gesture={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cam:{...cam},mode:2,moved:true}}
  }
},{passive:false});
stage.addEventListener('pointermove',e=>{
  if(laser&&laser.active&&e.pointerId===laser.id){e.preventDefault();laserPush(e);return}
  if(panning&&e.pointerId===panning.id){e.preventDefault();camTarget=null;setCam({s:panning.cam.s,x:panning.cam.x+e.clientX-panning.sx,y:panning.cam.y+e.clientY-panning.sy},false);return}
  if(drawing&&e.pointerId===drawing.id){e.preventDefault();addPoints(e);return}
  if(erasing){eraseAt(toSheet(e));return}
  if(!touches.has(e.pointerId)||!gesture)return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const t=[...touches.values()],r=stage.getBoundingClientRect();
  if(gesture.mode===1&&t.length===1){
    const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;
    if(!gesture.moved&&Math.hypot(dx,dy)<10)return;
    gesture.moved=true;camTarget=null;setCam({s:gesture.cam.s,x:gesture.cam.x+dx,y:gesture.cam.y+dy},false);
  }else if(gesture.mode===2&&t.length>=2){
    const a=t[0],b=t[1],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const s=Math.max(.25,Math.min(6,gesture.cam.s*d/gesture.d));
    const px=(gesture.mx-r.left-gesture.cam.x)/gesture.cam.s,py=(gesture.my-r.top-gesture.cam.y)/gesture.cam.s;
    camTarget=null;setCam({s,x:mx-r.left-px*s,y:my-r.top-py*s},false);
  }
},{passive:false});
function endPointer(e){
  if(panning&&e.pointerId===panning.id){panning=null;if(e.pointerType==='pen'){lastPen=Date.now();penDown=false}return}
  if(laser&&laser.active&&e.pointerId===laser.id){laser.active=false;if(e.pointerType==='pen'){lastPen=Date.now();penDown=false}return}
  if(drawing&&e.pointerId===drawing.id){
    clearTimeout(holdTimer);holdTimer=null;holdAt=null;
    const st=drawing;drawing=null;lctx.clearRect(0,0,live.width/ldpr,live.height/ldpr);
    if(e.type!=='pointercancel'||st.p.length>2){
      const q=toSheet(e),l=st.p[st.p.length-1];if(!st.s&&Math.hypot(q[0]-l[0],q[1]-l[1])>0.2){q.push(l[2]);st.p.push(q)}
      st.p=st.p.map(q=>[+q[0].toFixed(1),+q[1].toFixed(1),+q[2].toFixed(2)]);
      pushHist();strokes.push(st);inkSvg.appendChild(strokeEl(st));saveInk();
    }
    if(e.pointerType==='pen'){lastPen=Date.now();penDown=false}
    return;
  }
  if(erasing){erasing=false;lastErase=null;drawEraserRing(null);saveInk();if(e.pointerType==='pen'){lastPen=Date.now();penDown=false}return}
  if(e.pointerType==='pen'){lastPen=Date.now();penDown=false}
  if(touches.has(e.pointerId)){
    const g=gesture;touches.delete(e.pointerId);
    if(e.type==='pointerup'&&g&&g.mode===1&&!g.moved&&view==='class'&&Date.now()-g.t<350&&Date.now()-lastPen>900)go(1);
    if(touches.size===0)gesture=null;
    else if(touches.size===1){const t=[...touches.values()][0];gesture={sx:t.x,sy:t.y,t:0,moved:true,cam:{...cam},mode:1}}
  }
}
stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);
stage.addEventListener('wheel',e=>{
  if(!L)return;e.preventDefault();const r=stage.getBoundingClientRect();camTarget=null;
  if(e.ctrlKey){const s=Math.max(.25,Math.min(6,cam.s*Math.exp(-e.deltaY/200))),px=(e.clientX-r.left-cam.x)/cam.s,py=(e.clientY-r.top-cam.y)/cam.s;setCam({s,x:e.clientX-r.left-px*s,y:e.clientY-r.top-py*s},false)}
  else setCam({s:cam.s,x:cam.x-e.deltaX,y:cam.y-e.deltaY},false);
},{passive:false});

/* ---------- 網羅チェック表 ---------- */
function buildCheck(){
  let checked=store.get(KEY('check'))||{};
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  $('#rows').innerHTML=L.cover.map((c,i)=>`<tr><td><label><input type="checkbox" id="c${i}" aria-label="${esc(c[0])} を確認した" ${checked[i]?'checked':''}></label></td><td>${esc(c[0])}</td><td class="w">${esc(c[1])}</td></tr>`).join('');
  $('#adds').innerHTML=L.adds.map(c=>`<tr><td>${esc(c[0])}</td><td class="w">${esc(c[1])}</td></tr>`).join('');
  const prog=()=>{$('#progress').textContent=`（${L.cover.filter((_,i)=>checked[i]).length} / ${L.cover.length} 確認済み）`};
  $('#rows').addEventListener('change',e=>{checked[e.target.id.slice(1)]=e.target.checked;store.set(KEY('check'),checked);prog()});prog();
}

/* ---------- 教材を開く ---------- */
const bytes=b64=>{const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function openLesson(data){
  if(!window.pdfjsLib)throw new Error('PDFを表示する部品を読み込めませんでした。一度ネットにつないだ状態で開き直してね。');
  LID=data.id||'01-yayoi';
  strokes=store.get(KEY('ink'))||[];if(!Array.isArray(strokes))strokes=[];hist=[];
  const opt={isEvalSupported:false,disableFontFace:true,useSystemFonts:false};
  const [sd,ld]=await Promise.all([
    pdfjsLib.getDocument({data:bytes(data.student),...opt}).promise,
    pdfjsLib.getDocument({data:bytes(data.layers),...opt}).promise
  ]);
  L=data.layout;stuDoc=sd;layDoc=ld;
  const v=(await stuDoc.getPage(1)).getViewport({scale:1});pageW=v.width/PT;pageH=v.height/PT;
  idx=Math.min(Math.max(store.get(KEY('step'))||0,0),L.steps.length-1);
  await buildPages();renderInk();buildCheck();
  msg.hidden=true;setView(view);
}

/* ---------- 教材一覧（ホーム画面アプリ版）。教材は iPad の中（IndexedDB）にだけ保存する ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('jugyo-print',1);r.onupgradeneeded=()=>r.result.createObjectStore('lessons',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('lessons',mode),s=t.objectStore('lessons');const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('readonly',s=>s.getAll())},
  get(id){return this.tx('readonly',s=>s.get(id))},
  put(o){return this.tx('readwrite',s=>s.put(o))},
  del(id){return this.tx('readwrite',s=>s.delete(id))}
};
const libEl=$('#lib');
function libMsg(t,bad){const m=$('#libmsg');m.textContent=t;m.dataset.bad=bad?'1':''}
async function renderLib(){
  let list=[];try{list=await DB.all()}catch(e){libMsg('iPadの保存場所を開けませんでした。プライベートブラウズだと使えないよ。',true)}
  list.sort((a,b)=>String(a.id).localeCompare(String(b.id),'ja'));
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  $('#liblist').innerHTML=list.length?list.map(l=>`<li><button class="open" data-open="${esc(l.id)}"><b>${esc(l.title||l.id)}</b><small>${esc(new Date(l.added).toLocaleDateString('ja-JP'))} に読み込み</small></button><button class="del" data-del="${esc(l.id)}">削除</button></li>`).join('')
    :'<li class="empty">まだ教材がありません。下の「教材を読み込む」から、作成した教材ファイル（.lesson.json）を選んでね。</li>';
}
$('#liblist').addEventListener('click',async e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){location.hash='lesson='+encodeURIComponent(o.dataset.open);location.reload();return}
  if(d){
    if(d.dataset.arm!=='1'){d.dataset.arm='1';d.textContent='もう一度で削除';setTimeout(()=>{d.dataset.arm='';d.textContent='削除'},3000);return}
    await DB.del(d.dataset.del);libMsg('削除しました。');renderLib();
  }
});
$('#libfile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    if(o.format!=='jugyo-print-lesson'||!o.id||!o.layout||!o.student||!o.layers)throw new Error('format');
    const had=await DB.get(o.id);
    await DB.put({id:o.id,title:o.title||o.layout.title||o.id,added:Date.now(),data:o});
    libMsg(`「${o.title||o.id}」を${had?'新しい版に入れ替えました':'読み込みました'}。`);renderLib();
  }catch(err){libMsg('このファイルは教材ファイルとして読み込めませんでした。build.ps1 で作った .lesson.json を選んでね。',true)}
});
$('#tolib').onclick=()=>{location.hash='';location.reload()};

/* ---------- 起動 ---------- */
const SITE=!document.getElementById('lesson-data');
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(STANDALONE)$('#fs').hidden=true;
if(!SITE)$('#tolib').hidden=true;
function viewFromHash(){if(SITE)return'class';const h=location.hash.slice(1);return['student','answer','check'].includes(h)?h:'class'}
window.addEventListener('hashchange',()=>{if(!SITE)setView(viewFromHash())});
async function start(){
  sizeLive();setView(viewFromHash());
  try{
    if(!SITE){openLesson(JSON.parse(document.getElementById('lesson-data').textContent)).catch(e=>{msg.textContent=e&&e.message?e.message:'プリントを読み込めませんでした';console.error(e)});return}
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
    const m=location.hash.match(/^#lesson=(.+)$/);
    if(m){
      const rec=await DB.get(decodeURIComponent(m[1]));
      if(rec){await openLesson(rec.data);return}
    }
    msg.hidden=true;libEl.hidden=false;renderLib();
  }catch(e){msg.textContent=e&&e.message?e.message:'プリントを読み込めませんでした';console.error(e)}
}
start();
})();
